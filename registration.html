<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Page</title>
  <link rel="stylesheet" href="login-registration.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-container">
    <div class="login-container">
      <div class="form-box">
        <h1>Create Account</h1>
        <form id="registrationForm">
          <label for="regFullname">Fullname</label>
          <input type="text" id="regFullname" required placeholder="Enter your name">

          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" required placeholder="Enter your email">

          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required placeholder="Enter your password">

          <button type="submit" class="login-btn">Sign Up</button>
        </form>
        <p>Have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>
  <script src="login-regis.js"></script>
</body>
</html>
